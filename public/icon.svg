<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1d4ed8" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#2563eb" />
    </linearGradient>
    <linearGradient id="pulseGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Background rounded squircle -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)" />

  <!-- Subtle grid lines resembling city mobility & parking bays -->
  <path d="M 96,160 L 416,160 M 96,256 L 416,256 M 96,352 L 416,352" stroke="#ffffff" stroke-opacity="0.06" stroke-width="2" />
  <path d="M 160,96 L 160,416 M 256,96 L 256,416 M 352,96 L 352,416" stroke="#ffffff" stroke-opacity="0.06" stroke-width="2" />

  <!-- Circular Outer Navigation Radar Ring -->
  <circle cx="256" cy="256" r="160" fill="none" stroke="url(#accentGrad)" stroke-width="8" stroke-dasharray="16 8" stroke-opacity="0.4" />

  <!-- Shield / Marker Base -->
  <g filter="url(#shadow)">
    <!-- Parking Bay Card Shape -->
    <rect x="136" y="136" width="240" height="240" rx="48" fill="#1e293b" stroke="#3b82f6" stroke-width="4" />
    
    <!-- Bold 'UP' Monogram with Integrated 'P' Parking Sign -->
    <text x="256" y="270" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="110" fill="#ffffff" letter-spacing="-2">
      UP
    </text>
    
    <!-- Smart Live IoT Sensor Dot (Emerald) -->
    <circle cx="340" cy="180" r="16" fill="url(#pulseGrad)" stroke="#ffffff" stroke-width="3" />
  </g>

  <!-- Tagline Mini Subtext -->
  <text x="256" y="340" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="700" font-size="16" fill="#93c5fd" letter-spacing="4">
    FIND · PARK · GO
  </text>
</svg>
